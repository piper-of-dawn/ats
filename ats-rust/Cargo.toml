[package]
name = "ats-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4", features = ["derive"] }
httpdate = "1"
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "sync"] }

[dev-dependencies]
wiremock = "0.6"
