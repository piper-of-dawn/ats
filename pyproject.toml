[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ats"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "flask>=3.0.0",
    "gmail_parser @ https://github.com/piper-of-dawn/gmail_parser/releases/download/v0.1.0/gmail_parser-0.1.0-py3-none-any.whl",
    "ipykernel>=7.2.0",
    "numpy>=1.20.0",
    "pandas>=3.0.1",
    "polars>=1.38.1",
    "psycopg>=3.3.3",
    "pyarrow>=23.0.1",
    "tqdm>=4.67.3",
    "yfinance>=1.2.0",
]

[dependency-groups]
dev = [
    "altair>=6.0.0",
    "matplotlib>=3.10.8",
    "pytest>=8.3.0",
]

[project.scripts]
ats = "ats.cli:main"
dashboard-local = "ats.dashboard:run"
gmail-fund-nav-sync = "ats.gmail_sync:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
