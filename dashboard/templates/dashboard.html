<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Supabase Dashboard</title>
  <link rel="stylesheet" href="/static/css/dashboard.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="dashboard">
  <div class="dashboard-shell">
    <section
      id="nav-slot"
      class="lazy-slot"
      data-component-url="/partials/nav"
      data-component-kind="nav"
      data-component-label="Fund NAV"
    >
      <div class="card loading-card">
        <div class="loading-card-label">Fund NAV</div>
        <div class="loading-card-title">Loading chart</div>
        <div class="loading-card-skeleton loading-card-skeleton-lg"></div>
        <div class="loading-card-skeleton"></div>
      </div>
    </section>
    <div class="dashboard-grid">
      <div class="dashboard-main">
        <section
          id="main-table-slot"
          class="lazy-slot"
          data-component-url="/partials/table/us_midcap_metrics"
          data-component-kind="table"
          data-component-label="Midcap Metrics"
        >
          <div class="card loading-card">
            <div class="loading-card-label">Midcap Metrics</div>
            <div class="loading-card-title">Waiting for chart to finish</div>
            <div class="loading-card-skeleton"></div>
            <div class="loading-card-skeleton"></div>
            <div class="loading-card-skeleton"></div>
          </div>
        </section>
      </div>
      <aside class="dashboard-side">
        <section
          id="secondary-table-slot"
          class="lazy-slot"
          data-component-url="/partials/table/us_largecap_metrics"
          data-component-kind="table"
          data-component-label="Largecap Metrics"
        >
          <div class="card loading-card">
            <div class="loading-card-label">Largecap Metrics</div>
            <div class="loading-card-title">Queued behind the main table</div>
            <div class="loading-card-skeleton"></div>
            <div class="loading-card-skeleton"></div>
          </div>
        </section>
      </aside>
    </div>
  </div>
  <script>
    const loadComponentMarkup = async (slot) => {
      const response = await fetch(slot.dataset.componentUrl, {
        headers: {"X-Requested-With": "dashboard-lazy-load"}
      });
      const html = await response.text();
      slot.innerHTML = html;
      if (!response.ok && !html.trim()) {
        throw new Error(`Failed to load ${slot.dataset.componentLabel}`);
      }
      return slot;
    };

    const loadChartJs = async () => {
      if (window.Chart) return window.Chart;

      const chartScript = document.querySelector('script[src*="chart.umd.min.js"]');
      if (chartScript?.dataset.ready === "true") {
        return window.Chart;
      }

      return new Promise((resolve, reject) => {
        const onLoad = () => {
          chartScript.dataset.ready = "true";
          resolve(window.Chart);
        };
        const onError = () => reject(new Error("Chart library failed to load"));

        if (!chartScript) {
          reject(new Error("Chart library script is missing"));
          return;
        }

        chartScript.addEventListener("load", onLoad, {once: true});
        chartScript.addEventListener("error", onError, {once: true});
      });
    };

    const initNavChart = async (root) => {
      const canvas = root.querySelector("#nav-chart");
      const rangeButton = root.querySelector("#nav-range-button");
      const rangeLabel = root.querySelector("#nav-range-label");
      const rangeMenu = root.querySelector("#nav-range-menu");
      const maxDrawdownNode = root.querySelector("#nav-max-drawdown");
      const maxUpsideNode = root.querySelector("#nav-max-upside");

      if (!canvas) return;

      await loadChartJs();
      if (!window.Chart) return;

      const allPoints = JSON.parse(canvas.dataset.points || "[]");
      const positiveColor = "#1745F3";
      const negativeColor = "#B42318";
      const rangeDayMap = {"1D": 1, "5D": 5, "1M": 30, "6M": 183, "1Y": 365, "5Y": 1825};
      let currentAverage = 0;
      let visibleTickLabels = new Set();

      const formatPercent = (value) => `${value >= 0 ? "+" : "-"}${(Math.abs(value) * 100).toFixed(2)}%`;

      const computeAverage = (points) => (
        points.reduce((sum, point) => sum + point.y, 0) / Math.max(points.length, 1)
      );

      const computeMaxDrawdown = (points) => {
        if (points.length === 0) return 0;
        let peak = points[0].y;
        let maxDrawdown = 0;
        points.forEach((point) => {
          peak = Math.max(peak, point.y);
          if (peak) {
            maxDrawdown = Math.min(maxDrawdown, (point.y / peak) - 1);
          }
        });
        return maxDrawdown;
      };

      const computeMaxUpside = (points) => {
        if (points.length === 0) return 0;
        let trough = points[0].y;
        let maxUpside = 0;
        points.forEach((point) => {
          trough = Math.min(trough, point.y);
          if (trough) {
            maxUpside = Math.max(maxUpside, (point.y / trough) - 1);
          }
        });
        return maxUpside;
      };

      const computeVisibleTickLabels = (points) => {
        const count = points.length;
        if (count <= 5) {
          return new Set(points.map((point) => point.label));
        }
        const indices = new Set([0, count - 1, Math.floor(count / 4), Math.floor(count / 2), Math.floor((count * 3) / 4)]);
        return new Set(Array.from(indices).map((index) => points[index].label));
      };

      const filterPointsByRange = (range) => {
        if (allPoints.length === 0 || range === "MAX") return allPoints;

        const latest = new Date(`${allPoints[allPoints.length - 1].raw_date}T00:00:00`);
        if (Number.isNaN(latest.getTime())) return allPoints;

        if (range === "YTD") {
          const start = `${latest.getFullYear()}-01-01`;
          return allPoints.filter((point) => point.raw_date >= start);
        }

        const days = rangeDayMap[range];
        if (!days) return allPoints;

        const cutoff = new Date(latest);
        cutoff.setDate(cutoff.getDate() - days);
        const cutoffText = cutoff.toISOString().slice(0, 10);
        const filtered = allPoints.filter((point) => point.raw_date >= cutoffText);
        return filtered.length >= 2 ? filtered : allPoints.slice(Math.max(0, allPoints.length - 2));
      };

      const buildFillGradient = (chart) => {
        const {ctx, chartArea, scales} = chart;
        if (!chartArea || !Number.isFinite(currentAverage)) {
          return "rgba(23, 69, 243, 0.08)";
        }
        const averagePixel = scales.y.getPixelForValue(currentAverage);
        const stop = Math.min(1, Math.max(0, (averagePixel - chartArea.top) / (chartArea.bottom - chartArea.top)));
        const gradient = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
        gradient.addColorStop(0, "rgba(23, 69, 243, 0.16)");
        gradient.addColorStop(stop, "rgba(23, 69, 243, 0.05)");
        gradient.addColorStop(stop, "rgba(180, 35, 24, 0.05)");
        gradient.addColorStop(1, "rgba(180, 35, 24, 0.16)");
        return gradient;
      };

      const updateStats = (points) => {
        if (maxDrawdownNode) {
          maxDrawdownNode.textContent = formatPercent(computeMaxDrawdown(points));
        }
        if (maxUpsideNode) {
          maxUpsideNode.textContent = formatPercent(computeMaxUpside(points));
        }
      };

      const averageLinePlugin = {
        id: "averageLine",
        afterDatasetsDraw(chart) {
          const {ctx, chartArea, scales} = chart;
          if (!chartArea || !Number.isFinite(currentAverage)) return;
          const y = scales.y.getPixelForValue(currentAverage);
          ctx.save();
          ctx.strokeStyle = "rgba(145, 135, 120, 0.6)";
          ctx.setLineDash([5, 4]);
          ctx.beginPath();
          ctx.moveTo(chartArea.left, y);
          ctx.lineTo(chartArea.right, y);
          ctx.stroke();
          ctx.setLineDash([]);

          const label = `Average: $${currentAverage.toFixed(2)}`;
          ctx.font = "12px Segoe UI, Arial, sans-serif";
          const width = ctx.measureText(label).width + 18;
          const x = chartArea.right - width - 10;
          const h = 28;
          const r = 14;
          const top = Math.max(chartArea.top + 10, y - 14);
          ctx.fillStyle = "rgba(240, 235, 226, 0.96)";
          ctx.beginPath();
          ctx.moveTo(x + r, top);
          ctx.arcTo(x + width, top, x + width, top + h, r);
          ctx.arcTo(x + width, top + h, x, top + h, r);
          ctx.arcTo(x, top + h, x, top, r);
          ctx.arcTo(x, top, x + width, top, r);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "#7a7369";
          ctx.fillText(label, x + 9, top + 18);
          ctx.restore();
        }
      };

      const initialPoints = filterPointsByRange("YTD");
      currentAverage = computeAverage(initialPoints);
      visibleTickLabels = computeVisibleTickLabels(initialPoints);
      updateStats(initialPoints);

      const chart = new window.Chart(canvas, {
        type: "line",
        data: {
          labels: initialPoints.map((point) => point.label),
          datasets: [{
            data: initialPoints.map((point) => point.y),
            borderWidth: 2.25,
            pointRadius: 0,
            pointHitRadius: 8,
            pointHoverRadius: 3,
            fill: true,
            tension: 0.24,
            segment: {
              borderColor(context) {
                const midpoint = (context.p0.parsed.y + context.p1.parsed.y) / 2;
                return midpoint >= currentAverage ? positiveColor : negativeColor;
              }
            },
            backgroundColor(context) {
              return buildFillGradient(context.chart);
            }
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          plugins: {
            legend: {display: false},
            tooltip: {
              displayColors: false,
              backgroundColor: "rgba(34, 37, 41, 0.92)",
              callbacks: {
                label(context) {
                  return `NAV: $${Number(context.parsed.y).toFixed(2)}`;
                }
              }
            }
          },
          layout: {
            padding: {left: 8, right: 8, top: 8, bottom: 0}
          },
          scales: {
            x: {
              grid: {
                display: false,
                drawBorder: false
              },
              ticks: {
                color: "#998e7d",
                maxRotation: 0,
                autoSkip: false,
                callback(value) {
                  const label = this.getLabelForValue(value);
                  return visibleTickLabels.has(label) ? label : "";
                }
              }
            },
            y: {
              grace: "6%",
              grid: {
                display: false,
                drawBorder: false
              },
              ticks: {
                color: "#998e7d",
                callback(value) {
                  return Number(value).toFixed(1);
                }
              }
            }
          }
        },
        plugins: [averageLinePlugin]
      });

      const applyRange = (range) => {
        const points = filterPointsByRange(range);
        visibleTickLabels = computeVisibleTickLabels(points);
        currentAverage = computeAverage(points);
        updateStats(points);
        chart.data.labels = points.map((point) => point.label);
        chart.data.datasets[0].data = points.map((point) => point.y);
        chart.update();
        if (rangeLabel) {
          rangeLabel.textContent = range;
        }
      };

      if (rangeButton && rangeMenu) {
        rangeButton.addEventListener("click", () => {
          const expanded = rangeButton.getAttribute("aria-expanded") === "true";
          rangeButton.setAttribute("aria-expanded", String(!expanded));
          rangeMenu.hidden = expanded;
        });

        rangeMenu.querySelectorAll("button[data-range]").forEach((button) => {
          button.addEventListener("click", () => {
            applyRange(button.dataset.range);
            rangeButton.setAttribute("aria-expanded", "false");
            rangeMenu.hidden = true;
          });
        });

        document.addEventListener("click", (event) => {
          if (!rangeButton.contains(event.target) && !rangeMenu.contains(event.target)) {
            rangeButton.setAttribute("aria-expanded", "false");
            rangeMenu.hidden = true;
          }
        });
      }
    };

    const renderErrorState = (slot, error) => {
      slot.innerHTML = `
        <div class="card loading-card loading-card-error">
          <div class="loading-card-label">${slot.dataset.componentLabel}</div>
          <div class="loading-card-title">Failed to load</div>
          <p>${error.message}</p>
        </div>
      `;
    };

    const loadDashboardSequentially = async () => {
      const slots = Array.from(document.querySelectorAll(".lazy-slot"));
      for (const slot of slots) {
        try {
          await loadComponentMarkup(slot);
          if (slot.dataset.componentKind === "nav") {
            await initNavChart(slot);
          }
        } catch (error) {
          renderErrorState(slot, error);
        }
      }
    };

    window.addEventListener("DOMContentLoaded", () => {
      loadDashboardSequentially();
    });
  </script>
</body>
</html>
