<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Supabase Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    (function () {
      const storedTheme = window.localStorage.getItem("dashboard-theme");
      const theme = storedTheme === "light" || storedTheme === "dark" ? storedTheme : "dark";
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="/static/css/dashboard.css" />
  <link rel="stylesheet" href="/static/css/dashboard-light.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script defer src="/static/vendor/d3-annotation.min.js"></script>
  <script defer src="/static/js/nav-chart.js"></script>
  <script defer src="/static/js/treemap-chart.js"></script>
  <script defer src="/static/js/dashboard.js"></script>
</head>
<body class="dashboard">
  <button
    id="theme-toggle"
    class="theme-toggle"
    type="button"
    aria-label="Switch color theme"
    aria-live="polite"
  >
    <span class="theme-toggle-track">
      <span class="theme-toggle-option">LIGHT</span>
      <span class="theme-toggle-option">DARK</span>
    </span>
  </button>
  <div class="dashboard-shell">
    <section
      id="nav-slot"
      class="lazy-slot"
      data-component-url="/partials/nav"
      data-component-kind="nav"
      data-component-label="Fund NAV"
    >
      <div class="card loading-card">
        <div class="loading-card-label">Fund NAV</div>
        <div class="loading-card-title">Loading chart</div>
        <div class="loading-card-skeleton loading-card-skeleton-lg"></div>
        <div class="loading-card-skeleton"></div>
      </div>
    </section>
    <div class="exposure-grid">
      <section
        id="country-treemap-slot"
        class="lazy-slot"
        data-component-url="/partials/treemap/country"
        data-component-kind="treemap"
        data-component-label="Country Exposure"
      >
        <div class="card loading-card">
          <div class="loading-card-label">Country Exposure</div>
          <div class="loading-card-title">Loading positions treemap</div>
          <div class="loading-card-skeleton loading-card-skeleton-lg"></div>
          <div class="loading-card-skeleton"></div>
        </div>
      </section>
      <section
        id="currency-treemap-slot"
        class="lazy-slot"
        data-component-url="/partials/treemap/currency"
        data-component-kind="treemap"
        data-component-label="Currency Exposure"
      >
        <div class="card loading-card">
          <div class="loading-card-label">Currency Exposure</div>
          <div class="loading-card-title">Loading positions treemap</div>
          <div class="loading-card-skeleton loading-card-skeleton-lg"></div>
          <div class="loading-card-skeleton"></div>
        </div>
      </section>
    </div>
    <div class="dashboard-grid">
      <div class="dashboard-main">
        <section
          id="main-table-slot"
          class="lazy-slot"
          data-component-url="/partials/table/us_largecap_metrics"
          data-component-kind="table"
          data-component-label="US Large Cap Highlights"
        >
          <div class="card loading-card">
            <div class="loading-card-label">US Large Cap Highlights</div>
            <div class="loading-card-title">Waiting for chart to finish</div>
            <div class="loading-card-skeleton"></div>
            <div class="loading-card-skeleton"></div>
            <div class="loading-card-skeleton"></div>
          </div>
        </section>
      </div>
      <aside class="dashboard-side">
        <section
          id="secondary-table-slot"
          class="lazy-slot"
          data-component-url="/partials/table/us_midcap_metrics"
          data-component-kind="table"
          data-component-label="US Midcap Highlights"
        >
          <div class="card loading-card">
            <div class="loading-card-label">US Midcap Highlights</div>
            <div class="loading-card-title">Queued behind the main table</div>
            <div class="loading-card-skeleton"></div>
            <div class="loading-card-skeleton"></div>
          </div>
        </section>
      </aside>
    </div>
  </div>
</body>
</html>
