<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 - Table Not Found</title>
  <script>
    (function () {
      const storedTheme = window.localStorage.getItem("dashboard-theme");
      const theme = storedTheme === "light" || storedTheme === "dark" ? storedTheme : "dark";
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="/static/css/dashboard.css" />
  <link rel="stylesheet" href="/static/css/dashboard-light.css" />
</head>
<body class="not-found">
  <div class="card">
    <h1>404 - Table not found</h1>
    <p>The Supabase table <code>{{ table_name }}</code> does not exist or is not accessible.</p>
  </div>
</body>
</html>
