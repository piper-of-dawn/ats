<div class="card panel treemap-panel">
  <div class="table-card-header">
    <div class="table-card-title">{{ title.upper() }}</div>
  </div>
  {% if items %}
  <div
    class="treemap-root"
    data-treemap-group="{{ group_by }}"
    data-items='{{ items|tojson }}'
  >
    <div class="treemap-canvas-wrap">
      <div class="treemap-canvas" aria-label="{{ title }}"></div>
    </div>
    <div class="treemap-legend">
      {% for item in items[:6] %}
      <div class="treemap-legend-item" data-legend-index="{{ loop.index0 }}">
        <span class="treemap-legend-label">{{ item.label }}</span>
        <span class="treemap-legend-value">{{ item.share_pct }}</span>
      </div>
      {% endfor %}
    </div>
  </div>
  {% else %}
  <div class="panel-placeholder">
    <p>No positions data available for {{ title.lower() }}.</p>
  </div>
  {% endif %}
</div>
