services:
  ats:
    image: ${IMAGE_REF:?IMAGE_REF is required}
    container_name: ${CONTAINER_NAME:-ats}
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-/opt/ats/app.env}
    environment:
      SOURCE_TABLES: ${SOURCE_TABLES:?SOURCE_TABLES is required}
      MARKET_INDEX: ${MARKET_INDEX:?MARKET_INDEX is required}
